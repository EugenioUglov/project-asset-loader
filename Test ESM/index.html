<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asset Loader Demo</title>
  
</head>
<body>
  <div id="content-container">Loading content...</div>

  <script type="module">
    import ProjectAssetLoader from '/node_modules/project-asset-loader/dist/project-asset-loader.esm.js';
    const loader = new ProjectAssetLoader();

    loader.loadStyle({ path: './style.css' });
    loader.loadJavaScript({ path: './test.js' });

    // Render HTML template dynamically
    loader.loadMustacheHtmlToDomElementById({
      targetId: 'content-container',
      pathHtml: './templates/widget.html',
      data: { title: 'Welcome!' }
    });
  </script>
</body>
</html>
