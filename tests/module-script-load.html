<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Test Asset Loader (Default script)</title>
</head>
<body>

    <h1>Test UMD build</h1>
    <div id="content-container">Here must be a content</div>

    <script type="module">
        // Connect UMD-script of the package
        import ProjectAssetLoader from '/dist/project-asset-loader.esm.js';

        const loader = new ProjectAssetLoader({ enableDebug: true });
        console.log(loader);

        // Test loading css
        loader.loadStyle({path: './assets/styles.css'}).then(() => {
            console.log("Styles downloaded successfully!");
        });
    </script>
</body>
</html>
